<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemeMind AI - Learn. Imagine. Code.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container py-4">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <h2 class="text-info fw-bold m-0">🧠 MemeMind AI</h2>
      <span class="badge bg-success px-3 py-2">Gemini AI Ready</span>
    </header>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-fill mb-4 p-2 bg-dark rounded" id="featureTabs">
      <li class="nav-item">
        <button class="nav-link active" onclick="switchTab('explain')">💡 Explain</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('debug')">🐛 Debug</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('quiz')">🧠 Quiz</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('roadmap')">🗺️ Roadmap</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('repository')">📁 Repository & Saved</button>
      </li>
    </ul>

    <!-- Feature Input Form -->
    <div class="card p-4 mb-4 shadow">
      
      <!-- Style selector for Explain feature -->
      <div id="styleSelector" class="mb-3">
        <label class="form-label text-warning fw-semibold">CHOOSE YOUR LEARNING STYLE</label>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-info active style-btn" onclick="setStyle('meme', this)">🎭 Meme Style</button>
          <button type="button" class="btn btn-outline-info style-btn" onclick="setStyle('story', this)">📖 Story Style</button>
          <button type="button" class="btn btn-outline-info style-btn" onclick="setStyle('real-life', this)">🌐 Real Life</button>
        </div>
      </div>

      <div class="mb-3">
        <label id="inputLabel" class="form-label text-light fw-bold">Enter Topic or Question:</label>
        <textarea id="userInput" class="form-control bg-dark text-light border-secondary" rows="4" placeholder="Type here..."></textarea>
      </div>

      <button id="submitBtn" class="btn btn-primary btn-lg w-100" onclick="handleGenerate()">✨ Generate Result</button>
    </div>

    <!-- Output Box -->
    <div class="card p-4 mb-4 shadow d-none" id="outputCard">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="text-success m-0">MEMEMIND RESULT</h5>
        <button class="btn btn-sm btn-outline-light" onclick="saveCurrentResult()">💾 Save to Repository</button>
      </div>
      <div id="outputContent" class="output-box text-light"></div>
    </div>

    <!-- Saved Repository Items Section -->
    <div id="repositorySection" class="card p-4 shadow d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-info m-0">📁 Saved Repository & History</h4>
        <button class="btn btn-sm btn-outline-danger" onclick="clearRepository()">🗑️ Clear All</button>
      </div>
      <div id="savedList" class="d-flex flex-column gap-3"></div>
    </div>

  </div>

  <script>
    let activeTab = 'explain';
    let selectedStyle = 'meme';
    let currentResult = '';

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const styleSel = document.getElementById('styleSelector');
      const inputLabel = document.getElementById('inputLabel');
      const repoSection = document.getElementById('repositorySection');

      styleSel.classList.add('d-none');
      repoSection.classList.add('d-none');

      if (tab === 'explain') {
        styleSel.classList.remove('d-none');
        inputLabel.innerText = "Enter CS Concept to Explain:";
      } else if (tab === 'debug') {
        inputLabel.innerText = "Paste Code Snippet to Debug:";
      } else if (tab === 'quiz') {
        inputLabel.innerText = "Enter Topic for Quiz:";
      } else if (tab === 'roadmap') {
        inputLabel.innerText = "Enter Tech Stack or Subject for Roadmap:";
      } else if (tab === 'repository') {
        inputLabel.innerText = "Search Saved Repository or Query AI:";
        repoSection.classList.remove('d-none');
        loadRepository();
      }
    }

    function setStyle(style, btn) {
      selectedStyle = style;
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function handleGenerate() {
      const input = document.getElementById('userInput').value.trim();
      if (!input) return alert('Please enter input text!');

      const outCard = document.getElementById('outputCard');
      const outContent = document.getElementById('outputContent');
      const submitBtn = document.getElementById('submitBtn');

      outCard.classList.remove('d-none');
      outContent.innerHTML = '<div class="spinner-border text-info" role="status"></div> Generating AI response...';
      submitBtn.disabled = true;

      let endpoint = `/api/${activeTab}`;
      let bodyData = {};

      if (activeTab === 'explain') bodyData = { prompt: input, style: selectedStyle };
      else if (activeTab === 'debug') bodyData = { code: input };
      else if (activeTab === 'quiz') bodyData = { concept: input };
      else if (activeTab === 'roadmap') bodyData = { concept: input };
      else if (activeTab === 'repository') bodyData = { query: input };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Server Request Failed');

        currentResult = data.result;

        // Convert Markdown formatting (### and **) to HTML
        let formatted = data.result
          .replace(/^### (.*$)/gim, '<h5 class="fw-bold text-info mb-2">$1</h5>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        outContent.innerHTML = `<div style="white-space: pre-wrap; line-height: 1.6;">${formatted}</div>`;

        // Automatically save to local history
        saveToLocalStorage(activeTab, input, data.result);

      } catch (err) {
        outContent.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    function saveToLocalStorage(type, prompt, response) {
      let repo = JSON.parse(localStorage.getItem('mememind_repo') || '[]');
      repo.unshift({ id: Date.now(), type, prompt, response, date: new Date().toLocaleString() });
      localStorage.setItem('mememind_repo', JSON.stringify(repo));
    }

    function saveCurrentResult() {
      if (!currentResult) return alert('No result to save!');
      alert('Saved to Repository successfully!');
      if (activeTab === 'repository') loadRepository();
    }

    function loadRepository() {
      const savedList = document.getElementById('savedList');
      let repo = JSON.parse(localStorage.getItem('mememind_repo') || '[]');

      if (repo.length === 0) {
        savedList.innerHTML = '<p class="text-muted">No saved items yet.</p>';
        return;
      }

      savedList.innerHTML = repo.map(item => `
        <div class="card p-3 saved-card">
          <div class="d-flex justify-content-between text-muted small mb-1">
            <span><strong>TYPE:</strong> ${item.type.toUpperCase()}</span>
            <span>${item.date}</span>
          </div>
          <p class="fw-bold text-warning mb-1">Q: ${item.prompt}</p>
          <div class="text-light small" style="white-space: pre-wrap;">${item.response.substring(0, 200)}...</div>
        </div>
      `).join('');
    }

    function clearRepository() {
      if (confirm('Are you sure you want to clear repository history?')) {
        localStorage.removeItem('mememind_repo');
        loadRepository();
      }
    }
  </script>
</body>
</html>
