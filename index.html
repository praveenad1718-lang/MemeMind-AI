<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMEMIND AI - Learn. Remember. Revise.</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Three.js for 3D Dotted Brain Background / Model -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Marked.js for Markdown Formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding-bottom: 50px;
    }
    .main-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 2;
    }
    /* Hero Title Section */
    .hero-section {
      text-align: center;
      margin-bottom: 10px;
    }
    .app-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    .app-tagline {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    /* 3D Brain Container in Flow */
    #brain-canvas-container {
      width: 100%;
      height: 220px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #brain-canvas-container canvas {
      outline: none;
    }
    /* Cards & UI */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      padding: 24px;
      margin-bottom: 20px;
    }
    .style-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      padding: 15px;
    }
    .style-card.active, .style-card:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg, #9333ea, #4f46e5);
      color: white;
    }
    .output-box {
      background: rgba(10, 15, 25, 0.9);
      border: 1px solid #30363d;
      border-radius: 12px;
      color: #f8fafc;
      padding: 20px;
      line-height: 1.7;
      max-height: 450px;
      overflow-y: auto;
    }
    .output-box h1, .output-box h2, .output-box h3 {
      color: #38bdf8;
      margin-top: 15px;
    }
    .bright-sub {
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- 1 & 2. Title and Tagline -->
    <div class="hero-section">
      <h1 class="app-title">MEMEMIND AI</h1>
      <div class="app-tagline">Learn • Remember • Revise</div>
    </div>

    <!-- 3. Rotating Dotted 3D Brain Model -->
    <div id="brain-canvas-container"></div>

    <!-- 4. Input & 3 Modes Section -->
    <div class="glass-card">
      <label class="form-label text-info fw-bold mb-3">CHOOSE EXPLANATION MODE</label>
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="style-card active" onclick="setStyle('meme', this)">
            <h6 class="text-white fw-bold m-0">🎭 Meme Style</h6>
            <small class="bright-sub">Coding humor & fun</small>
          </div>
        </div>
        <div class="col-md-4">
          <div class="style-card" onclick="setStyle('story', this)">
            <h6 class="text-white fw-bold m-0">📖 Story Style</h6>
            <small class="bright-sub">Engaging story narrative</small>
          </div>
        </div>
        <div class="col-md-4">
          <div class="style-card" onclick="setStyle('real-life', this)">
            <h6 class="text-white fw-bold m-0">🌐 Real Life</h6>
            <small class="bright-sub">Practical real-world examples</small>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-white fw-bold">Enter Doubt / Topic / Code:</label>
        <textarea id="userInput" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Type your doubt or concept here..."></textarea>
      </div>

      <button id="submitBtn" class="btn btn-gradient w-100" onclick="handleGenerate()">✨ Generate Explanation</button>
    </div>

    <!-- Output & Re-ask Doubt Box Section -->
    <div class="glass-card d-none" id="outputCard">
      <h5 class="text-success fw-bold mb-3">🧠 MEMEMIND EXPLANATION</h5>
      <div id="outputContent" class="output-box mb-4"></div>

      <!-- Follow-up / Re-ask doubt box -->
      <div class="pt-3 border-top border-secondary">
        <label class="form-label text-warning fw-bold small">💬 Re-ask doubt or ask follow-up:</label>
        <div class="input-group">
          <input type="text" id="followUpInput" class="form-control bg-dark text-white border-secondary" placeholder="Ask your doubt about this explanation...">
          <button class="btn btn-outline-info fw-bold" onclick="handleFollowUp()" id="followUpBtn">Ask Doubt</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let selectedStyle = 'meme';
    let currentResult = '';
    let rawMarkdownResult = '';
    let currentInput = '';

    function setStyle(style, el) {
      selectedStyle = style;
      document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    async function handleGenerate() {
      const input = document.getElementById('userInput').value.trim();
      if (!input) return alert('Please enter a doubt or topic!');

      currentInput = input;
      const outCard = document.getElementById('outputCard');
      const outContent = document.getElementById('outputContent');
      const submitBtn = document.getElementById('submitBtn');

      outCard.classList.remove('d-none');
      outContent.innerHTML = '<div class="spinner-border text-info" role="status"></div> Generating AI explanation...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: input, style: selectedStyle })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server Error');

        rawMarkdownResult = data.result;
        currentResult = data.result;
        outContent.innerHTML = marked.parse(data.result);
      } catch (err) {
        outContent.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    async function handleFollowUp() {
      const doubt = document.getElementById('followUpInput').value.trim();
      if (!doubt) return alert('Please enter your doubt!');

      const outContent = document.getElementById('outputContent');
      const followUpBtn = document.getElementById('followUpBtn');

      rawMarkdownResult += `\n\n### 💬 Doubt: ${doubt}\n`;
      outContent.innerHTML = marked.parse(rawMarkdownResult) + `<div class="spinner-border spinner-border-sm text-info mt-2" role="status"></div> Thinking...`;
      followUpBtn.disabled = true;

      try {
        const res = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: `Context: ${currentResult}\n\nDoubt: ${doubt}`, style: selectedStyle })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server Error');

        rawMarkdownResult += `\n${data.result}`;
        currentResult += `\n\nDoubt: ${doubt}\nAnswer: ${data.result}`;
        outContent.innerHTML = marked.parse(rawMarkdownResult);
        document.getElementById('followUpInput').value = '';
      } catch (err) {
        outContent.innerHTML += `<br><span class="text-danger">Error: ${err.message}</span>`;
      } finally {
        followUpBtn.disabled = false;
      }
    }

    // 3D Rotating Dotted Brain Animation using Three.js
    const container = document.getElementById('brain-canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const brainGroup = new THREE.Group();

    // Dotted node and wireframe material matching reference image
    const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.3 });
    const coreMaterial = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.4 });

    // Left and Right hemispheres
    const leftGeo = new THREE.SphereGeometry(6, 20, 20);
    leftGeo.scale(1.3, 1.1, 1.5);
    const leftMesh = new THREE.Mesh(leftGeo, wireMaterial);
    leftMesh.position.x = -3.2;
    brainGroup.add(leftMesh);

    const rightGeo = new THREE.SphereGeometry(6, 20, 20);
    rightGeo.scale(1.3, 1.1, 1.5);
    const rightMesh = new THREE.Mesh(rightGeo, coreMaterial);
    rightMesh.position.x = 3.2;
    brainGroup.add(rightMesh);

    // Glowing Dotted Synapse Particles
    const particleCount = 100;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 13;     // x
      positions[i + 1] = (Math.random() - 0.5) * 8;  // y
      positions[i + 2] = (Math.random() - 0.5) * 14; // z
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      color: 0x00ffff,
      size: 0.45,
      transparent: true,
      opacity: 0.9
    });
    const particleSystem = new THREE.Points(geometry, particleMaterial);
    brainGroup.add(particleSystem);

    scene.add(brainGroup);
    camera.position.z = 16;

    function animate() {
      requestAnimationFrame(animate);
      brainGroup.rotation.y += 0.003;
      brainGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.08;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
