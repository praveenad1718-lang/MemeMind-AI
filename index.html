<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemeMind AI - Learn. Imagine. Code.</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="py-4">

  <!-- 3D Canvas Background -->
  <canvas id="bg3dCanvas"></canvas>

  <div class="container app-container" style="max-width: 850px;">
    
    <!-- Title & Tagline -->
    <div class="text-center mb-4">
      <h1 class="fw-bold display-5 mb-1 title-gradient">MemeMind AI</h1>
      <p class="fw-semibold text-light fs-6 mb-0">Learn. Imagine. Code.</p>
    </div>

    <!-- Navigation Tabs (5 Features) -->
    <ul class="nav nav-pills justify-content-center mb-4" id="featureTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="explain-tab" data-bs-toggle="pill" data-bs-target="#explain-pane">💡 Explain</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="debug-tab" data-bs-toggle="pill" data-bs-target="#debug-pane">🐞 Debug Code</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="quiz-tab" data-bs-toggle="pill" data-bs-target="#quiz-pane">📝 Quiz Master</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="roadmap-tab" data-bs-toggle="pill" data-bs-target="#roadmap-pane">🗺️ Roadmap</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="repo-tab" data-bs-toggle="pill" data-bs-target="#repo-pane">📁 Repository</button>
      </li>
    </ul>

    <!-- Input Card -->
    <div class="tab-content main-card p-4 mb-4" id="tabContent">
      
      <!-- 1. EXPLAIN -->
      <div class="tab-pane fade show active" id="explain-pane">
        <h5 class="fw-bold mb-3 text-white">💡 What's on your mind?</h5>
        <textarea id="explainInput" class="form-control mb-4" rows="3" placeholder="Enter a concept or doubt you want to understand..."></textarea>
        
        <label class="form-label section-label mb-2">CHOOSE YOUR LEARNING STYLE</label>
        
        <div class="row g-3 mb-4">
          <div class="col-4">
            <div class="style-option selected" onclick="selectStyle(this, 'meme')">
              <div class="style-title mb-1">😜 Meme</div>
              <div class="style-desc">Learn with humor</div>
            </div>
          </div>
          <div class="col-4">
            <div class="style-option" onclick="selectStyle(this, 'story')">
              <div class="style-title mb-1">📖 Story</div>
              <div class="style-desc">Learn through stories</div>
            </div>
          </div>
          <div class="col-4">
            <div class="style-option" onclick="selectStyle(this, 'real-life')">
              <div class="style-title mb-1">🌍 Real Life</div>
              <div class="style-desc">Learn with examples</div>
            </div>
          </div>
        </div>

        <button onclick="runExplain()" class="btn btn-action w-100">✨ Generate Learning →</button>
      </div>

      <!-- 2. DEBUG -->
      <div class="tab-pane fade" id="debug-pane">
        <h5 class="fw-bold mb-3 text-white">🐞 Debug My Code</h5>
        <textarea id="debugInput" class="form-control mb-4 font-monospace" rows="5" placeholder="Paste your code snippet here..."></textarea>
        <button onclick="runDebug()" class="btn btn-action w-100">🔍 Identify Bugs & Fix →</button>
      </div>

      <!-- 3. QUIZ -->
      <div class="tab-pane fade" id="quiz-pane">
        <h5 class="fw-bold mb-3 text-white">🎯 Quiz Master</h5>
        <input type="text" id="quizInput" class="form-control mb-4" placeholder="Enter topic (e.g. Java Inheritance, Async/Await)..." />
        <button onclick="runQuiz()" class="btn btn-action w-100">📝 Create Quiz →</button>
      </div>

      <!-- 4. ROADMAP -->
      <div class="tab-pane fade" id="roadmap-pane">
        <h5 class="fw-bold mb-3 text-white">🗺️ Learning Roadmap</h5>
        <input type="text" id="roadmapInput" class="form-control mb-4" placeholder="Enter topic (e.g. React.js, Full-Stack Development)..." />
        <button onclick="runRoadmap()" class="btn btn-action w-100">🧭 Generate Roadmap →</button>
      </div>

      <!-- 5. REPOSITORY -->
      <div class="tab-pane fade" id="repo-pane">
        <h5 class="fw-bold mb-3 text-white">📁 Search Repository</h5>
        <input type="text" id="repoInput" class="form-control mb-4" placeholder="Enter topic or code concept to search saved items..." />
        <button onclick="runRepo()" class="btn btn-action w-100">🔍 Search Saved Topics →</button>
      </div>

    </div>

    <!-- Output Card -->
    <div class="main-card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="fw-bold text-white">MEMEMIND <span id="statusBadge" class="status-badge badge-ready">• AI READY</span></div>
      </div>
      <div id="outputContainer" class="p-3 rounded output-box">
        <p class="text-light m-0">Your AI learning experience will appear here...</p>
      </div>
    </div>

  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Custom Logic & 3D Script -->
  <script src="script.js"></script>
</body>
</html>
