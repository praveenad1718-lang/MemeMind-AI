<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemeMind AI - Learn. Remember. Code.</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Three.js for 3D Background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      background-color: #050811;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    .main-card {
      background: rgba(15, 23, 42, 0.70);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .nav-pills .nav-link {
      color: #cbd5e1;
      border-radius: 10px;
      font-weight: 600;
    }
    .nav-pills .nav-link.active {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .style-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .style-card.active, .style-card:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      color: white;
      font-weight: 600;
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg, #9333ea, #4f46e5);
      color: white;
    }
    .output-box {
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid #30363d;
      border-radius: 12px;
      color: #f8fafc;
    }
    .folder-badge {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      font-weight: 500;
      transition: all 0.2s;
    }
    .folder-badge.active, .folder-badge:hover {
      background: #6366f1;
      color: white;
      border-color: #818cf8;
    }
    .bright-text {
      color: #94a3b8 !important;
    }
  </style>
</head>
<body>

  <!-- 3D Brain Background Canvas -->
  <div id="canvas-container"></div>

  <div class="container py-4">
    <!-- Header with Tagline -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <div>
        <h2 class="text-info fw-bold m-0">🧠 MEMEMIND AI</h2>
        <small class="text-warning fw-semibold">Learn. Remember. Code. (Multi-Disciplinary Repository)</small>
      </div>
      <span class="badge bg-success px-3 py-2 fw-bold">System Online</span>
    </header>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-fill mb-4 p-2 main-card" id="featureTabs">
      <li class="nav-item">
        <button class="nav-link active" onclick="switchTab('explain', this)">💡 Explain</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('debug', this)">🐛 Debug</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('quiz', this)">🧠 Quiz</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('roadmap', this)">🗺️ Roadmap</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="switchTab('repository', this)">📁 Repository</button>
      </li>
    </ul>

    <!-- Input Form Card -->
    <div class="main-card p-4 mb-4" id="mainInputCard">
      
      <!-- Style Selector Cards with Bright Text -->
      <div id="styleSelector" class="mb-4">
        <label class="form-label text-info fw-bold mb-3">CHOOSE YOUR LEARNING STYLE</label>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="style-card p-3 text-center active" onclick="setStyle('meme', this)">
              <h5 class="m-0 text-white fw-bold">🎭 Meme Style</h5>
              <small class="bright-text">Learn with coding humor & fun</small>
            </div>
          </div>
          <div class="col-md-4">
            <div class="style-card p-3 text-center" onclick="setStyle('story', this)">
              <h5 class="m-0 text-white fw-bold">📖 Story Style</h5>
              <small class="bright-text">Learn through engaging stories</small>
            </div>
          </div>
          <div class="col-md-4">
            <div class="style-card p-3 text-center" onclick="setStyle('real-life', this)">
              <h5 class="m-0 text-white fw-bold">🌐 Real Life</h5>
              <small class="bright-text">Practical real-world examples</small>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label id="inputLabel" class="form-label text-white fw-bold">Enter Topic or Question:</label>
        <textarea id="userInput" class="form-control bg-dark text-white border-secondary" rows="4" placeholder="Type your topic or paste code here..."></textarea>
      </div>

      <button id="submitBtn" class="btn btn-gradient btn-lg w-100" onclick="handleGenerate()">✨ Generate Learning</button>
    </div>

    <!-- Output Result Section -->
    <div class="main-card p-4 mb-4 d-none" id="outputCard">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-success fw-bold m-0">MEMEMIND RESULT</h5>
        <div class="d-flex gap-2 align-items-center">
          <select id="saveFolderSelect" class="form-select form-select-sm bg-dark text-white border-secondary">
            <!-- Folders populated dynamically -->
          </select>
          <button class="btn btn-sm btn-info text-nowrap fw-bold" onclick="saveCurrentResult()">💾 Save</button>
        </div>
      </div>
      <div id="outputContent" class="output-box p-3 text-white"></div>
    </div>

    <!-- Repository Saved Items Section -->
    <div id="repositorySection" class="main-card p-4 d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-info fw-bold m-0">📁 Folders & Repositories</h4>
        <button class="btn btn-sm btn-outline-success fw-bold" onclick="createNewFolder()">➕ New Folder</button>
      </div>

      <!-- Folder Selection Badges -->
      <div id="folderBadges" class="d-flex flex-wrap gap-2 mb-4"></div>

      <div id="savedList" class="d-flex flex-column gap-3"></div>
    </div>

  </div>

  <script>
    let activeTab = 'explain';
    let selectedStyle = 'meme';
    let currentResult = '';
    let currentInput = '';
    let selectedFolderView = 'All';

    let defaultFolders = ['Python', 'Java', 'English', 'History', 'Commerce', 'Mathematics', 'Physics'];

    function getFolders() {
      let custom = JSON.parse(localStorage.getItem('mememind_folders') || '[]');
      return Array.from(new Set([...defaultFolders, ...custom]));
    }

    function populateFolderSelect() {
      const select = document.getElementById('saveFolderSelect');
      const folders = getFolders();
      select.innerHTML = folders.map(f => `<option value="${f}">${f}</option>`).join('');
    }

    function renderFolderBadges() {
      const container = document.getElementById('folderBadges');
      const folders = getFolders();
      
      let html = `<span class="folder-badge ${selectedFolderView === 'All' ? 'active' : ''}" onclick="filterByFolder('All')">📂 All</span>`;
      html += folders.map(f => `
        <span class="folder-badge ${selectedFolderView === f ? 'active' : ''}" onclick="filterByFolder('${f}')">📁 ${f}</span>
      `).join('');

      container.innerHTML = html;
    }

    function createNewFolder() {
      const folderName = prompt('Enter New Repository/Subject Name (e.g., Economics, Chemistry, Tamil):');
      if (folderName && folderName.trim() !== '') {
        let cleanName = folderName.trim();
        let custom = JSON.parse(localStorage.getItem('mememind_folders') || '[]');
        if (!custom.includes(cleanName) && !defaultFolders.includes(cleanName)) {
          custom.push(cleanName);
          localStorage.setItem('mememind_folders', JSON.stringify(custom));
        }
        populateFolderSelect();
        renderFolderBadges();
        filterByFolder(cleanName);
      }
    }

    function switchTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('#featureTabs .nav-link').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const mainInputCard = document.getElementById('mainInputCard');
      const styleSel = document.getElementById('styleSelector');
      const repoSection = document.getElementById('repositorySection');
      const inputLabel = document.getElementById('inputLabel');
      const userInput = document.getElementById('userInput');

      repoSection.classList.add('d-none');
      mainInputCard.classList.remove('d-none');
      styleSel.classList.add('d-none');

      if (tab === 'explain') {
        styleSel.classList.remove('d-none');
        inputLabel.innerText = 'Enter Topic or Question:';
        userInput.placeholder = 'Type your topic here...';
      } else if (tab === 'debug') {
        inputLabel.innerText = 'Paste Code to Debug:';
        userInput.placeholder = 'Paste your buggy code here...';
      } else if (tab === 'quiz') {
        inputLabel.innerText = 'Enter Topic for Quiz:';
        userInput.placeholder = 'Enter topic to generate quiz questions...';
      } else if (tab === 'roadmap') {
        inputLabel.innerText = 'Enter Learning Goal or Subject:';
        userInput.placeholder = 'e.g., Full Stack Developer, Ancient History, Python...';
      } else if (tab === 'repository') {
        mainInputCard.classList.add('d-none');
        repoSection.classList.remove('d-none');
        renderFolderBadges();
        loadRepository();
      }
    }

    function setStyle(style, el) {
      selectedStyle = style;
      document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    async function handleGenerate() {
      const input = document.getElementById('userInput').value.trim();
      if (!input) return alert('Please enter input text!');

      currentInput = input;
      const outCard = document.getElementById('outputCard');
      const outContent = document.getElementById('outputContent');
      const submitBtn = document.getElementById('submitBtn');

      outCard.classList.remove('d-none');
      outContent.innerHTML = '<div class="spinner-border text-info" role="status"></div> Generating AI response...';
      submitBtn.disabled = true;

      populateFolderSelect();

      try {
        const res = await fetch(`/api/${activeTab}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: input, code: input, concept: input, query: input, style: selectedStyle })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server Error');

        currentResult = data.result;
        outContent.innerHTML = `<div style="white-space: pre-wrap; line-height: 1.6;">${data.result}</div>`;

      } catch (err) {
        outContent.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    function saveCurrentResult() {
      if (!currentResult) return alert('No result to save!');
      const selectedFolder = document.getElementById('saveFolderSelect').value;

      let repo = JSON.parse(localStorage.getItem('mememind_repo') || '[]');
      repo.unshift({
        id: Date.now(),
        folder: selectedFolder,
        type: activeTab,
        prompt: currentInput,
        response: currentResult,
        date: new Date().toLocaleString()
      });

      localStorage.setItem('mememind_repo', JSON.stringify(repo));
      alert(`Saved under '${selectedFolder}' repository!`);
    }

    function filterByFolder(folderName) {
      selectedFolderView = folderName;
      renderFolderBadges();
      loadRepository();
    }

    function loadRepository() {
      const savedList = document.getElementById('savedList');
      let repo = JSON.parse(localStorage.getItem('mememind_repo') || '[]');

      if (selectedFolderView !== 'All') {
        repo = repo.filter(item => item.folder === selectedFolderView);
      }

      if (repo.length === 0) {
        savedList.innerHTML = `<p class="text-warning">No items saved in '${selectedFolderView}' repository.</p>`;
        return;
      }

      savedList.innerHTML = repo.map(item => `
        <div class="card p-3 bg-dark border-secondary">
          <div class="d-flex justify-content-between text-warning small mb-1">
            <span>📁 <strong>${item.folder || 'General'}</strong> | ${item.type.toUpperCase()}</span>
            <span>${item.date}</span>
          </div>
          <p class="fw-bold text-info mb-1">Q: ${item.prompt}</p>
          <div class="text-white small" style="white-space: pre-wrap;">${item.response}</div>
        </div>
      `).join('');
    }

    // Larger 3D Brain Setup (Positioned prominently in background)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const brainGroup = new THREE.Group();
    const materialWire = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.4 });
    const materialCore = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.65 });

    // Left Hemisphere (Larger Scale)
    const leftGeo = new THREE.SphereGeometry(9, 20, 20);
    leftGeo.scale(1.3, 1.0, 1.5);
    const leftMesh = new THREE.Mesh(leftGeo, materialWire);
    leftMesh.position.x = -4.5;
    brainGroup.add(leftMesh);

    // Right Hemisphere (Larger Scale)
    const rightGeo = new THREE.SphereGeometry(9, 20, 20);
    rightGeo.scale(1.3, 1.0, 1.5);
    const rightMesh = new THREE.Mesh(rightGeo, materialCore);
    rightMesh.position.x = 4.5;
    brainGroup.add(rightMesh);

    // Central core node cluster
    const coreGeo = new THREE.IcosahedronGeometry(5, 2);
    const coreMesh = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true, transparent: true, opacity: 0.5 }));
    brainGroup.add(coreMesh);

    scene.add(brainGroup);
    
    // Moved camera closer so the brain looks huge and clear in the background
    camera.position.z = 18;
    brainGroup.position.y = 1;

    function animate() {
      requestAnimationFrame(animate);
      brainGroup.rotation.y += 0.003;
      brainGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.15;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
