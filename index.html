<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemeMind AI - Learn. Imagine. Code.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary-purple: #7c3aed;
      --accent-blue: #3b82f6;
    }

    body {
      background-color: var(--bg-color);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 3D Canvas Background Positioning */
    #bg3dCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .nav-pills {
      gap: 12px;
    }

    .nav-pills .nav-link {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: #94a3b8;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-pills .nav-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-pills .nav-link.active {
      background: rgba(124, 58, 237, 0.15);
      border-color: var(--primary-purple);
      color: #ffffff;
    }

    .style-option {
      cursor: pointer;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }

    .style-option:hover, .style-option.selected {
      border-color: var(--primary-purple);
      background: rgba(124, 58, 237, 0.1);
    }

    .btn-action {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 10px;
      padding: 12px;
      transition: opacity 0.2s ease;
    }

    .btn-action:hover {
      opacity: 0.9;
      color: white;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .badge-ready {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .badge-loading {
      background: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .badge-error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .form-control, .form-control:focus {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: #ffffff;
      border-radius: 10px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.6;
    }
  </style>
</head>
<body class="py-5">

  <!-- 3D Canvas Container -->
  <canvas id="bg3dCanvas"></canvas>

  <div class="container" style="max-width: 850px;">
    
    <!-- Navigation Tabs -->
    <ul class="nav nav-pills justify-content-center mb-4" id="featureTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="explain-tab" data-bs-toggle="pill" data-bs-target="#explain-pane">💡 Explain</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="debug-tab" data-bs-toggle="pill" data-bs-target="#debug-pane">🐞 Debug Code</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="quiz-tab" data-bs-toggle="pill" data-bs-target="#quiz-pane">📝 Quiz Master</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="roadmap-tab" data-bs-toggle="pill" data-bs-target="#roadmap-pane">🗺️ Roadmap</button>
      </li>
    </ul>

    <!-- Input Card -->
    <div class="tab-content main-card p-4 mb-4" id="tabContent">
      
      <!-- 1. EXPLAIN -->
      <div class="tab-pane fade show active" id="explain-pane">
        <h5 class="fw-bold mb-3">💡 What's on your mind?</h5>
        <textarea id="explainInput" class="form-control mb-4" rows="3" placeholder="Enter a concept or doubt you want to understand..."></textarea>
        
        <label class="form-label text-muted small mb-2">Choose your learning style</label>
        <div class="row g-3 mb-4">
          <div class="col-4">
            <div class="style-option selected" onclick="selectStyle(this, 'meme')">
              <div class="fw-bold mb-1">😜 Meme</div>
              <div class="small text-muted">Learn with humor</div>
            </div>
          </div>
          <div class="col-4">
            <div class="style-option" onclick="selectStyle(this, 'story')">
              <div class="fw-bold mb-1">📖 Story</div>
              <div class="small text-muted">Learn through stories</div>
            </div>
          </div>
          <div class="col-4">
            <div class="style-option" onclick="selectStyle(this, 'real-life')">
              <div class="fw-bold mb-1">🌍 Real Life</div>
              <div class="small text-muted">Learn with examples</div>
            </div>
          </div>
        </div>

        <button onclick="runExplain()" class="btn btn-action w-100">✨ Generate Learning →</button>
      </div>

      <!-- 2. DEBUG -->
      <div class="tab-pane fade" id="debug-pane">
        <h5 class="fw-bold mb-3">🐞 Debug My Code</h5>
        <textarea id="debugInput" class="form-control mb-4 font-monospace" rows="5" placeholder="Paste your code snippet here..."></textarea>
        <button onclick="runDebug()" class="btn btn-action w-100">🔍 Identify Bugs & Fix →</button>
      </div>

      <!-- 3. QUIZ -->
      <div class="tab-pane fade" id="quiz-pane">
        <h5 class="fw-bold mb-3">🎯 Quiz Master</h5>
        <input type="text" id="quizInput" class="form-control mb-4" placeholder="Enter topic (e.g. Java Inheritance, Async/Await)..." />
        <button onclick="runQuiz()" class="btn btn-action w-100">📝 Create Quiz →</button>
      </div>

      <!-- 4. ROADMAP -->
      <div class="tab-pane fade" id="roadmap-pane">
        <h5 class="fw-bold mb-3">🗺️ Learning Roadmap</h5>
        <input type="text" id="roadmapInput" class="form-control mb-4" placeholder="Enter topic (e.g. React.js, Full-Stack Development)..." />
        <button onclick="runRoadmap()" class="btn btn-action w-100">🧭 Generate Roadmap →</button>
      </div>

    </div>

    <!-- Output Card -->
    <div class="main-card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="fw-bold">MEMEMIND <span id="statusBadge" class="status-badge badge-ready">• AI READY</span></div>
      </div>
      <div id="outputContainer" class="p-3 rounded" style="background: rgba(0, 0, 0, 0.2);">
        <p class="text-muted m-0">Your AI learning experience will appear here...</p>
      </div>
    </div>

  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Application & 3D Script -->
  <script>
    // 3D Background Mesh setup
    const canvas = document.getElementById('bg3dCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
    const material = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, opacity: 0.15, transparent: true });
    const torusKnot = new THREE.Mesh(geometry, material);
    scene.add(torusKnot);

    camera.position.z = 30;

    function animate() {
      requestAnimationFrame(animate);
      torusKnot.rotation.x += 0.003;
      torusKnot.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Frontend State & Functions
    let selectedStyle = 'meme';

    function selectStyle(element, style) {
      document.querySelectorAll('.style-option').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedStyle = style;
    }

    async function handleApiCall(endpoint, bodyData) {
      const outputContainer = document.getElementById('outputContainer');
      const statusBadge = document.getElementById('statusBadge');

      outputContainer.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Generating response...';
      statusBadge.className = 'status-badge badge-loading';
      statusBadge.innerText = '• GENERATING';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed.');
        }

        outputContainer.innerHTML = `<pre class="m-0 text-light">${data.result}</pre>`;
        statusBadge.className = 'status-badge badge-ready';
        statusBadge.innerText = '• AI READY';
      } catch (error) {
        outputContainer.innerHTML = `<span class="text-danger">⚠️ ${error.message}</span>`;
        statusBadge.className = 'status-badge badge-error';
        statusBadge.innerText = '• ERROR';
      }
    }

    function runExplain() {
      const prompt = document.getElementById('explainInput').value;
      if (!prompt) return alert('Please enter a concept.');
      handleApiCall('/api/explain', { prompt, style: selectedStyle });
    }

    function runDebug() {
      const code = document.getElementById('debugInput').value;
      if (!code) return alert('Please enter code to debug.');
      handleApiCall('/api/debug', { code });
    }

    function runQuiz() {
      const concept = document.getElementById('quizInput').value;
      if (!concept) return alert('Please enter a quiz topic.');
      handleApiCall('/api/quiz', { concept });
    }

    function runRoadmap() {
      const concept = document.getElementById('roadmapInput').value;
      if (!concept) return alert('Please enter a roadmap topic.');
      handleApiCall('/api/roadmap', { concept });
    }
  </script>
</body>
</html>
